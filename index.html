<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/bot-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Siteless — лиды без сайта</title>
    <meta name="description" content="Telegram-бот, который находит компании без сайта, но с телефоном. Готовый список клиентов для веб-студий и фрилансеров." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171b22" media="(prefers-color-scheme: dark)" />
    <script>
      // Тема до загрузки стилей, чтобы тёмная не мигала светлой.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Siteless" />
    <meta property="og:title" content="Siteless — лиды без сайта" />
    <meta property="og:description" content="Telegram-бот, который находит компании без сайта, но с телефоном. WhatsApp-ссылки, статусы и экспорт в CSV." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
